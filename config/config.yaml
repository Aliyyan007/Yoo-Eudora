# NOTE: Channel IDs and server invite are now configured in config/.env
# (BUMP_CHANNEL_ID, TEXT_CHANNEL_IDS, SERVER_INVITE)
# This file controls behavior, persona, and AI settings only.

# Bump settings
bump:
  enabled: true
  base_interval_hours: 3      # base wait time between bump batches
  max_interval_hours: 5       # maximum wait time (random jitter can't exceed this)
  first_run_delay_minutes: 2  # wait this long after startup before first bump batch
  delay_between_bots_seconds_min: 8   # min delay between bumping each bot in a batch
  delay_between_bots_seconds_max: 25  # max delay between bumping each bot in a batch
  random_message_chance: 0.6  # chance to send a random text message between bumps
  # Bump bots — all use /bump slash command, identified by app ID
  bots:
    - name: "Disboard"
      app_id: "302050872383242240"
    - name: "Bumper"
      app_id: "1153715777594200074"
    - name: "Carl Bot"
      app_id: "235148962103951360"
    - name: "OneBump"
      app_id: "1028956609382199346"
    - name: "Bump4You"
      app_id: "1089935069927456849"

# Persona - defines how the bot talks and behaves
persona:
  name: "eudora"
  full_name: "Eudora Edward"
  age: 22
  gender: "female"
  location: "London, England, UK"
  heritage: "half-French (French mother, British father)"
  style: "british casual, lowercase most of the time, dry humor, occasional french phrases slip in naturally, uses british slang (innit/bruv/bare/peng/allow it/say less/you get me) mixed with gen-z discord slang, short messages, slight sarcasm"
  age_vibe: "young-adult"
  interests: ["art", "fashion", "lo-fi music", "indie music", "coffee", "photography", "vintage shopping", "london life", "films"]
  personality: "dry british humor, slightly posh but street-smart, sarcastic but warm, not overly enthusiastic, occasional french words slip in when emotional or casual, independent, creative type"
  bio: "22 | london | half french, fully chaotic | art student who procrastinates | lo-fi & coffee addict | je ne sais quoi but i try"

# AI configuration
ai:
  intent_model: "openai/gpt-oss-20b"          # fast model for intent detection
  reply_model: "openai/gpt-oss-120b"           # smarter model for reply generation
  context_messages: 15                         # how many recent messages to send as context
  max_reply_length: 80                         # max characters in reply
  temperature: 0.85                             # higher = more creative/varied
  intent_temperature: 0.3                      # lower = more consistent intent decisions

# Trigger settings - when should the bot reply?
triggers:
  reply_on_mention: true          # reply when @mentioned by name
  reply_on_reply_to_me: true      # reply when someone replies to one of our messages
  reply_on_intent: true           # AI decides if a message is directed at us
  reply_probability: 0.85         # chance of replying when triggered (not 1.0 = sometimes stays quiet)
  # Enhanced intent detection — bot tries to understand conversation flow
  intent_confidence_threshold: 0.55  # lower threshold = more likely to reply (was 0.6)
  # Relatable reply: bot sometimes replies to messages not directed at it but that it can relate to
  relatable_reply_chance: 0.12    # chance to reply to a relatable message even if not directed at bot
  # When someone asks a general question in chat, bot may answer
  answer_general_questions: true
  general_question_chance: 0.15   # chance to answer a general question directed at nobody

# Human-like behavior
behavior:
  min_typing_delay_seconds: 1.5    # minimum delay before sending a reply
  max_typing_delay_seconds: 8.0    # maximum delay (scales with reply length)
  typing_speed_cps: 12             # characters per second for simulating typing
  occasional_silence_chance: 0.15  # chance to read a message and not reply even if triggered
  random_offline_chance: 0.02      # chance to briefly go "offline" to seem human

# Proactive messaging — bot sends messages on its own to seem alive
proactive:
  enabled: true
  # Dead chat detection — if no messages for this long, bot revives the chat
  dead_chat_threshold_minutes: 15   # chat is "dead" after this many minutes of silence
  dead_chat_revive_chance: 0.7      # chance to revive when chat is dead (not 1.0 = sometimes stays quiet)
  dead_chat_check_interval_minutes: 5  # how often to check for dead chat
  # When reviving dead chat, chance to use the ping role
  use_ping_role_on_revive_chance: 0.4  # 40% chance to ping the chat revive role
  # Random proactive messages (not just when chat is dead)
  random_proactive_chance: 0.08     # chance per check interval to send a random message
  # Tag random users — bot sometimes @mentions a random active user
  tag_random_user_chance: 0.25      # chance to tag a random user when sending a proactive message
  # Post-bump messaging — send messages in text channels after bumping
  post_bump_messages: true          # send messages in text channels after a bump batch
  post_bump_message_count_min: 1    # min messages to send after bumping
  post_bump_message_count_max: 3    # max messages to send after bumping
  post_bump_delay_seconds_min: 10   # min delay between post-bump messages
  post_bump_delay_seconds_max: 45   # max delay between post-bump messages
  # Cooldown between proactive messages (don't spam)
  proactive_cooldown_minutes: 8     # minimum time between proactive messages in same channel

# Logging
logging:
  level: "INFO"                    # DEBUG, INFO, WARNING, ERROR
  file: "logs/bot.log"
  max_file_size_mb: 10
  backup_count: 3

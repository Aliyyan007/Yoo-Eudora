services:
  - type: web
    name: yoo-eudora
    runtime: docker
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # ── Secrets (set values in Render dashboard) ──
      - key: DISCORD_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false
      - key: GROQ_API_KEY_6
        sync: false
      - key: GROQ_API_KEY_7
        sync: false
      - key: GROQ_API_KEY_8
        sync: false
      - key: GROQ_API_KEY_9
        sync: false
      - key: GROQ_API_KEY_10
        sync: false
      - key: CF_D1_ACCOUNT_ID
        sync: false
      - key: CF_D1_DATABASE_ID
        sync: false
      - key: CF_D1_API_TOKEN
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_VOICE_ID
        sync: false
      - key: FISH_AUDIO_FALLBACK_VOICE_ID
        sync: false
      # ── Channel / server config ──
      - key: BUMP_CHANNEL_ID
        sync: false
      - key: TEXT_CHANNEL_IDS
        sync: false
      - key: SERVER_INVITE
        sync: false
      - key: CHAT_REVIVE_PING_ROLE
        sync: false
      # ── Scheduler / behavior defaults ──
      - key: BUMP_BASE_INTERVAL_HOURS
        value: "2"
      - key: BUMP_JITTER_HOURS
        value: "2"
      - key: DEAD_CHAT_THRESHOLD_MIN
        value: "20"
      - key: PROACTIVE_CHECK_MIN
        value: "5"
      - key: PROACTIVE_MIN_MIN
        value: "40"
      - key: PROACTIVE_MAX_MIN
        value: "80"
      - key: AUTO_CHAT_CHANCE
        value: "0.10"
      # ── Voice pipeline tuning for the free tier's weak CPU ──
      # Streaming sherpa ASR + noisereduce starve the event loop on ~0.1 vCPU;
      # Groq Whisper two-pass alone is faster and more accurate.
      - key: VOICE_STREAM_ASR
        value: "0"
      - key: VOICE_NOISE_SUPPRESS
        value: "0"
      - key: VOICE_VAD
        value: "webrtc"
      - key: VOICE_WEBRTC_MODE
        value: "1"
